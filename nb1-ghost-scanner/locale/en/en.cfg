[mod-setting-description]
nb1-ghost-scanner-areas-per-tick=How many logistic cells (or Area regions) are scanned each tick. Lower numbers improve UPS. Default=5.
nb1-ghost-scanner-update-interval=Minimum ticks between full re-scans of each scanner. If there are many scanners the effective interval doubles. Default=180.
nb1-ghost-scanner-area-scan-delay=Minimum tick spacing between scan work slices. Default=5.
nb1-ghost-scanner-max-results=Limits ghosts found per scan pass. 0 removes the limit. Lower improves UPS. Default=1000.
nb1-ghost-scanner-show-hidden=Report hidden items too (e.g. LTN request slots).
nb1-ghost-scanner-negative-output=Output values as negative numbers (useful for request combinators).
nb1-ghost-scanner-round-to-stack=Round item counts up (or down when Invert output is on) to the next full stack.
nb1-ghost-scanner-area-max-side=Maximum side length (tiles) for an Area-mode selection. Larger selections are refused. Default=512.
nb1-ghost-scanner-overlay-border-color=Color (including alpha) of the outline drawn around the Area-mode selection while you hover over the scanner.
nb1-ghost-scanner-overlay-fill-color=Color (including alpha) of the fill drawn inside the Area-mode selection while you hover over the scanner. Lower the alpha to keep entities beneath visible.
