name: Release

# One tag per mod release: `<mod>@<version>`, where <mod> is the mod directory
# and <version> equals its info.json version. The tagged commit must be on main.
#
#   git tag nb1-ghost-scanner@1.0.1
#   git push origin nb1-ghost-scanner@1.0.1
on:
  push:
    tags: ["*@*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to mod portal
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # origin/main is needed for the ancestry check

      - name: Resolve mod from tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mod="${TAG%@*}"
          version="${TAG##*@}"
          if [[ ! -f "$mod/info.json" ]]; then
            echo "::error::tag $TAG: no mod directory '$mod'"
            exit 1
          fi
          info="$(jq -r '"\(.name)@\(.version)"' "$mod/info.json")"
          if [[ "$info" != "$mod@$version" ]]; then
            echo "::error::tag $TAG does not match $mod/info.json ($info)"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $TAG points to a commit that is not on main"
            exit 1
          fi
          echo "mod=$mod" >> "$GITHUB_OUTPUT"

      - uses: denoland/setup-deno@v2
        with:
          cache: true
      - run: deno install --frozen

      - name: Pack
        working-directory: ${{ steps.tag.outputs.mod }}
        run: deno task pack

      - name: Upload to mod portal
        working-directory: ${{ steps.tag.outputs.mod }}
        env:
          FACTORIO_API_KEY: ${{ secrets.FACTORIO_API_KEY }}
        run: deno run -A ../tools/scripts/publish-mod.ts
